version: "2"

linters:
  settings:
    staticcheck:
      # The golangci-lint default set, minus the two refactoring suggestions.
      # QF1001 (De Morgan's law) and QF1003 (tagged switch) are readability
      # opinions, and the existing forms often read closer to the comment
      # above them.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1003
  exclusions:
    rules:
      # A failed Close on a deferred cleanup path is not actionable: the
      # process is already unwinding and there is nowhere to report it.
      # Checking it everywhere would add noise without adding safety.
      - linters: [errcheck]
        source: "^\\s*defer "

issues:
  # Report every occurrence. The defaults truncate repeated messages, which
  # makes a partially fixed file look finished.
  max-same-issues: 0
  max-issues-per-linter: 0
